<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Tech Challenge</title>
    <!-- Icons used for buttons. See https://fontawesome.com/search to find more-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Map -->
    <div id="cesiumContainer"></div>
    <!-- Controls -->
    <div class="controlsContainer">
      <!-- Basic Controls -->
      <button id="home-button" onclick="window.location.href='/index.html'"><i class="fas fa-home"></i>Home</button>
      <button id="help-button"><i class="fa-brands fa-readme"></i> README</button>
      <!-- Additional Controls - Add as needed -->
      <button id="custom-button">Custom Button</button>
      <button id="time-button"><i class="fa-solid fa-clock-rotate-left"></i></button>
      <div id="timeslicer">        
        <input type="range" min="0.0" max="64.0" step="0.1" data-bind="value: maximumScreenSpaceError, valueUpdate: 'input'">
        <input type="text" size="5" data-bind="value: time">
      </div>
    </div>
    <script type="module">
      import { doSomething } from "./fire"
      // *********** CONTROL HANDLING **********************
      // Handle button clicks
      // Add button click handlers for any custom controls
      document.getElementById("custom-button").addEventListener("click", async () => {
        doSomething()
      })
    </script>
  </body>
</html>
